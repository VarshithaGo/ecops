apiVersion: v1
kind: ConfigMap
metadata:
  name: citizen-service-config
  namespace: ecops
data:
  SERVER_PORT: "8083"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-citizen:5432/citizen_db
  SPRING_DATASOURCE_USERNAME: ecops
  KEYCLOAK_JWK_URI: http://keycloak:8085/realms/ecops-realm/protocol/openid-connect/certs
  KEYCLOAK_ISSUER_URI: http://localhost:8085/realms/ecops-realm
  KEYCLOAK_SERVER_URL: http://keycloak:8085
  KEYCLOAK_REALM: ecops-realm
  KEYCLOAK_SERVICE_CLIENT_ID: ecops-services
---
apiVersion: v1
kind: Secret
metadata:
  name: citizen-service-secret
  namespace: ecops
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: ecops_pass
  ECOPS_INTERNAL_SECRET: prod-internal-secret-change-me
  KEYCLOAK_SERVICE_CLIENT_SECRET: change-me-in-keycloak-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citizen-service
  namespace: ecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citizen-service
  template:
    metadata:
      labels:
        app: citizen-service
    spec:
      initContainers:
        - name: wait-keycloak
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -qO- http://keycloak:8085/realms/master; do echo waiting for keycloak; sleep 5; done']
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c',
            'until nc -z postgres-citizen 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: citizen-service
          image: ecops/citizen-service:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: citizen-service-config
            - secretRef:
                name: citizen-service-secret
          ports:
            - containerPort: 8083
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: citizen-service
  namespace: ecops
spec:
  selector:
    app: citizen-service
  ports:
    - port: 8083
      targetPort: 8083
