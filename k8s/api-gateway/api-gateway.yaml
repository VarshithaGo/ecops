apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecops
data:
  SERVER_PORT: "8080"
  KEYCLOAK_JWK_URI: http://keycloak:8085/realms/ecops-realm/protocol/openid-connect/certs
  KEYCLOAK_ISSUER_URI: http://localhost:8085/realms/ecops-realm
  CITIZEN_SERVICE_URL: http://citizen-service:8083
  AUTH_ADMIN_SERVICE_URL: http://auth-admin-service:8081
  CASE_SERVICE_URL: http://case-service:8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-keycloak
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -qO- http://keycloak:8085/realms/master; do echo waiting for keycloak; sleep 5; done']
      containers:
        - name: api-gateway
          image: ecops/api-gateway:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: api-gateway-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecops
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
