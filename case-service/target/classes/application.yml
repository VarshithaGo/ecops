server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: case-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/case_db}
    username: ${SPRING_DATASOURCE_USERNAME:ecops}
    password: ${SPRING_DATASOURCE_PASSWORD:ecops_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8085/realms/ecops-realm/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/ecops-realm}

ecops:
  internal:
    secret: ${ECOPS_INTERNAL_SECRET:dev-internal-secret-change-in-prod}
  services:
    citizen-url: ${CITIZEN_SERVICE_URL:http://localhost:8083}
    auth-admin-url: ${AUTH_ADMIN_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
