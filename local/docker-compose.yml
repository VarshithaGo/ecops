# Local development infrastructure for e-Cops.
#   - One Postgres instance, published on the three ports the services expect
#     (5433 auth_admin_db, 5434 case_db, 5435 citizen_db) so the services run
#     with their DEFAULT config — no env overrides needed.
#   - Keycloak in dev mode, importing the ecops realm on first start.
#
# Usage (from the repo root):
#   docker compose -f local/docker-compose.yml up -d
# Then run the 4 Spring services + the frontend (see ../run-local.sh or README).
services:
  postgres:
    image: postgres:16
    container_name: ecops-postgres
    environment:
      POSTGRES_USER: ecops
      POSTGRES_PASSWORD: ecops_pass
      POSTGRES_DB: ecops
    # All three host ports forward to the single container; each service picks
    # its own database by name, so their default datasource URLs just work.
    ports:
      - "5433:5432"
      - "5434:5432"
      - "5435:5432"
    volumes:
      - ecops-pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecops"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ecops-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HTTP_PORT: "8080"
    ports:
      - "8085:8080"
    volumes:
      # Any *-realm.json here is imported on first start (idempotent after that).
      - ./import:/opt/keycloak/data/import:ro

volumes:
  ecops-pgdata:
